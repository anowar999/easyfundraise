<svg xmlns="http://www.w3.org/2000/svg" width="640" height="140" viewBox="0 0 640 140" role="img" aria-labelledby="t d">
  <title id="t">EasyFundraise</title>
  <desc id="d">Upward raise mark of three stacked chevrons in a rounded square, with the EasyFundraise wordmark.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0F62FE"/>
      <stop offset="1" stop-color="#2D7BFF"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <rect x="10" y="10" width="120" height="120" rx="28" fill="url(#g)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="40,96 70,66 100,96" opacity="0.45"/>
    <polyline points="40,74 70,44 100,74" opacity="0.75"/>
    <polyline points="40,52 70,22 100,52"/>
  </g>
  <circle cx="70" cy="110" r="6" fill="#16A34A"/>
  <!-- Wordmark -->
  <text x="156" y="88" font-family="Inter, Geist, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#0B1220">
    Easy<tspan fill="#0F62FE">Fundraise</tspan>
  </text>
</svg>
