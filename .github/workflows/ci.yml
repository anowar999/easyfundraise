name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ef
          POSTGRES_PASSWORD: ef
          POSTGRES_DB: easyfundraise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ef" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      EF_DATABASE_URL: postgresql+psycopg://ef:ef@localhost:5432/easyfundraise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Migrations apply cleanly
        run: alembic upgrade head && python -m app.cli seed
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Stylesheet is not empty
        run: test "$(cat .next/static/css/*.css | wc -c)" -gt 10000
